# Placeholder values for local/dev use only. In staging/production, create this
# Secret out-of-band (kubectl create secret / sealed-secrets / external-secrets) —
# never commit real credentials here.
apiVersion: v1
kind: Secret
metadata:
  name: oficina-os-service-secret
  labels:
    app: oficina-os-service
type: Opaque
stringData:
  DATABASE_URL: "postgresql://oficina:oficina@oficina-db:5432/oficina_db"
  JWT_SECRET: "dev_secret_key"
  WEBHOOK_SECRET: "dev_webhook_secret"
  NEW_RELIC_LICENSE_KEY: "dev_newrelic_license_key"
  NEW_RELIC_ENABLED: "false"
  SNS_TOPIC_ARN: "arn:aws:sns:us-east-1:000000000000:oficina-os-events"
  SQS_QUEUE_URL: "http://localhost:4566/000000000000/oficina-os-queue"
