# sonar.organization NAO e definido aqui: o CI passa via -Dsonar.organization,
# a partir da repository variable SONAR_ORGANIZATION do GitHub.

sonar.projectKey=oficina-os-service
sonar.projectName=oficina-os-service

sonar.sources=src
sonar.tests=src

sonar.test.inclusions=**/*.spec.ts
# generated/ = client Prisma gerado em src/generated; *.e2e-spec.ts = testes e2e
sonar.exclusions=**/*.spec.ts,**/*.e2e-spec.ts,**/generated/**,**/node_modules/**,**/dist/**

# Espelha collectCoverageFrom do jest (package.json), mantendo as mesmas exclusoes
sonar.coverage.exclusions=**/*.module.ts,**/main.ts,**/*.dto.ts,**/generated/**

sonar.sourceEncoding=UTF-8

# Typescript + Jest coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.json
