name: CI/CD

on:
  push:
    branches: [main, develop]
    # Um merge que mexe só em documentação não precisa buildar imagem nem
    # fazer deploy. O filtro fica deliberadamente só no push: em
    # pull_request, paths-ignore faria o workflow nem iniciar num PR só de
    # docs, e o required status check (Fase 6) ficaria pendente para sempre,
    # travando o merge.
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [main, develop]
  # Permite reexecutar o deploy sem precisar de um commit vazio — útil para
  # redeployar após mudar um secret, ou para demonstrar a pipeline ao vivo.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  AWS_REGION: us-east-1
  # Precisa bater com var.cluster_name do repo oficina-infra-k8s, que é quem
  # provisiona o cluster. Este repo só consome.
  CLUSTER_NAME: oficina-cluster

jobs:
  # --- Build da aplicação + testes automatizados ----------------------------
  build-and-test:
    runs-on: ubuntu-latest
    # O token fica no env do job porque o `if` de step não lê `secrets`
    # diretamente; assim o scan pode ser pulado quando o secret não existe.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      # fetch-depth: 0 — o Sonar precisa do histórico completo para calcular
      # new code e blame.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - run: yarn install --frozen-lockfile
      - run: yarn lint:ci
      - run: yarn build
      # test:cov aplica o threshold de cobertura (coverageThreshold do
      # package.json); a pipeline falha se regredir.
      - run: yarn test:cov

      # Pula (sem falhar) em forks ou quando o secret SONAR_TOKEN não existe.
      # O quality gate ainda NÃO bloqueia (sem sonar.qualitygate.wait); passa
      # a ser blocking na Fase 9 T8.
      - name: SonarQube Cloud scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          args: -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}

  # --- BDD: saga ponta a ponta contra o stack docker-compose.bdd.yml --------
  # Sem filtro de paths: roda em todo PR e push, em paralelo ao build-and-test.
  # Só valores de teste do .env.bdd; sem secrets.
  bdd:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - run: yarn install --frozen-lockfile

      - name: Sobe o stack BDD
        run: docker compose -f docker-compose.bdd.yml up -d --build --wait

      # O cucumber não lê o .env.bdd sozinho: exporta as variáveis no step.
      - name: Roda os cenários BDD
        run: |
          set -a
          . ./.env.bdd
          set +a
          yarn test:bdd

      - name: Logs do stack (falha)
        if: failure()
        run: docker compose -f docker-compose.bdd.yml logs --no-color

      - name: Derruba o stack
        if: always()
        run: docker compose -f docker-compose.bdd.yml down -v

  # --- Terraform: formatação, init sem backend e validação ------------------
  # Só checagens estáticas: sem backend S3, sem credenciais AWS, sem secrets.
  terraform-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.x
          terraform_wrapper: false

      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate -no-color

  # --- Build da imagem Docker + publicação no GHCR --------------------------
  docker-build-push:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        run: |
          base=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "base=$base" >> "$GITHUB_OUTPUT"
          # A tag de deploy é o SHA, nunca `latest`: garante que o rollout
          # aponta exatamente para o que este build produziu.
          echo "image=$base:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.base }}:${{ github.sha }}
            ${{ steps.meta.outputs.base }}:latest

  # --- Deploy no EKS --------------------------------------------------------
  # Este repo é dono do deploy da própria aplicação: o repo de infraestrutura
  # (oficina-infra-k8s) só provisiona o cluster e expõe como alcançá-lo.
  # Ver ADR 0001.
  deploy:
    needs: docker-build-push
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # O environment do GitHub é o que faz `secrets.DATABASE_URL` resolver para
    # o banco certo: secret de environment tem precedência sobre o do
    # repositório. Ambiente único: o secret de DATABASE_URL fica no environment
    # `prod`, e não no escopo do repositório.
    environment: prod
    env:
      HAS_AWS: ${{ secrets.AWS_ACCESS_KEY_ID != '' && 'true' || 'false' }}
      APP_IMAGE: ${{ needs.docker-build-push.outputs.image }}
      # Ambiente único: todo deploy vai para o namespace prod.
      NAMESPACE: prod
    steps:
      - uses: actions/checkout@v4

      - name: Aviso — deploy pulado
        if: env.HAS_AWS == 'false'
        run: |
          echo "::warning::Secrets de AWS não configurados; nada foi publicado no cluster."
          echo "::warning::Imagem publicada no GHCR: $APP_IMAGE"

      - uses: aws-actions/configure-aws-credentials@v4
        if: env.HAS_AWS == 'true'
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # Só usado em conta AWS Academy Learner Lab (credencial temporária).
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configurar kubeconfig
        if: env.HAS_AWS == 'true'
        run: aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION"

      # Trava contra apontar o deploy para um banco que não é o da aplicação. Só
      # o nome do database é comparado, e nada derivado do secret é impresso:
      # a mensagem de erro diz o que era esperado, não o que veio.
      - name: Conferir se DATABASE_URL é a do ambiente
        if: env.HAS_AWS == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL não configurada para o environment '$NAMESPACE'."
            exit 1
          fi

          DB_NAME=$(node -e 'process.stdout.write(new URL(process.env.DATABASE_URL).pathname.slice(1))')
          if [ "$DB_NAME" != "oficina_os" ]; then
            echo "::error::DATABASE_URL do environment '$NAMESPACE' não aponta para o banco 'oficina_os'. Confira o secret desse environment."
            exit 1
          fi
          echo "DATABASE_URL confere com o ambiente $NAMESPACE."

      # O Secret é criado a partir dos secrets do repositório, nunca de um
      # arquivo versionado (ver ADR 0001). DATABASE_URL vem do output de
      # oficina-infra-db/bootstrap-db.
      - name: Publicar Secret da aplicação
        if: env.HAS_AWS == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
          SNS_TOPIC_ARN: ${{ secrets.SNS_TOPIC_ARN }}
          SQS_QUEUE_URL: ${{ secrets.SQS_QUEUE_URL }}
        run: |
          kubectl create secret generic oficina-os-service-secret \
            --namespace "$NAMESPACE" \
            --from-literal=DATABASE_URL="$DATABASE_URL" \
            --from-literal=JWT_SECRET="$JWT_SECRET" \
            --from-literal=WEBHOOK_SECRET="$WEBHOOK_SECRET" \
            --from-literal=NEW_RELIC_LICENSE_KEY="$NEW_RELIC_LICENSE_KEY" \
            --from-literal=SNS_TOPIC_ARN="$SNS_TOPIC_ARN" \
            --from-literal=SQS_QUEUE_URL="$SQS_QUEUE_URL" \
            --from-literal=NEW_RELIC_ENABLED="true" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Aplicar ConfigMap e Service
        if: env.HAS_AWS == 'true'
        run: |
          kubectl apply -n "$NAMESPACE" -f k8s/configmap.yaml
          kubectl apply -n "$NAMESPACE" -f k8s/service.yaml
          kubectl apply -n "$NAMESPACE" -f k8s/ingress.yaml

      # Migrations antes do rollout: se o schema falhar, a versão nova do
      # código nunca chega a subir contra um banco desatualizado (ADR 0005).
      - name: Rodar migrations (Job) e esperar terminar
        if: env.HAS_AWS == 'true'
        run: |
          export MIGRATION_JOB_NAME="oficina-migrate-${GITHUB_SHA::12}"
          envsubst < k8s/migration-job.yaml | kubectl apply -n "$NAMESPACE" -f -
          if ! kubectl wait -n "$NAMESPACE" --for=condition=complete \
               "job/$MIGRATION_JOB_NAME" --timeout=300s; then
            echo "::error::Migration falhou — rollout abortado. Logs do Job:"
            kubectl logs -n "$NAMESPACE" "job/$MIGRATION_JOB_NAME" --tail=100 || true
            exit 1
          fi

      - name: Aplicar Deployment e HPA
        if: env.HAS_AWS == 'true'
        run: |
          envsubst < k8s/deployment.yaml | kubectl apply -n "$NAMESPACE" -f -
          kubectl apply -n "$NAMESPACE" -f k8s/hpa.yaml

      - name: Aguardar rollout
        if: env.HAS_AWS == 'true'
        run: kubectl rollout status -n "$NAMESPACE" deployment/oficina-os-service --timeout=300s

      - name: Estado final do ambiente
        if: env.HAS_AWS == 'true'
        run: |
          kubectl get pods,svc,ingress,hpa -n "$NAMESPACE" -l app=oficina-os-service
